# Project-level Streamlit configuration.
# Theme values must stay in sync with ui/styles.css and tests/test_theme.py.

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111C33"
textColor = "#E2E8F0"
font = "sans-serif"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 50

[client]
toolbarMode = "minimal"
